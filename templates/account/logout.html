{% extends "base.html" %}

{% block title %}Sign Out{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <i class="bi bi-box-arrow-right text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-3 mb-3">Sign Out</h3>
                <p class="text-muted">Are you sure you want to sign out?</p>

                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                    </button>
                </form>

                <div class="mt-3">
                    <a href="{% url 'home' %}" class="text-muted text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
