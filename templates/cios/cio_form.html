{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="bi bi-{% if cio %}pencil-square{% else %}plus-circle{% endif %}"></i> {{ title }}</h3>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {% if cio %}Save Changes{% else %}Create CIO{% endif %}
                        </button>
                        {% if cio %}
                        <a href="{% url 'cios:detail' cio.slug %}" class="btn btn-outline-secondary">Cancel</a>
                        {% else %}
                        <a href="{% url 'cios:list' %}" class="btn btn-outline-secondary">Cancel</a>
                        {% endif %}
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
